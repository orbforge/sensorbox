# Custom branches for orb-forge devices that need ImageBuilders built
# from source (not available from downloads.openwrt.org).
#
# Loaded by ASU at startup via the BRANCHES_FILE env var. Entries are
# merged into ASU's hardcoded settings.branches dict.
#
# Branches with a `builder` section are managed by the openwrt-builder
# service. The builder checks the fork's HEAD commit against the
# existing container's label and only rebuilds when stale.

zero2:
  path: "releases/{version}"
  enabled: true
  snapshot: false
  package_changes: []
  apk: true
  # Builder config — used by the openwrt-builder service to know
  # how to build the ImageBuilder for this branch.
  builder:
    repo: "https://github.com/dboze/openwrt"
    branch: "pm-domains-fix"
    target: "rockchip/armv8"
    defconfig: "zero2.defconfig"
