id: friendlyarm_nanopi-r5c
title: "NanoPi R5C"
description: "Compact Orb probe with two GbE ports and an M.2 slot for optional Wi-Fi."
vendor_url: "https://www.friendlyelec.com/index.php?route=product/product&product_id=290"
docs_url: "https://orb.net/docs/devices/nanopi-r5c"

target: rockchip/armv8
profile: friendlyarm_nanopi-r5c
arch: aarch64_generic
version: "25.12.2"

capabilities:
  wifi: true

# Options render as dropdowns in the UI. Each choice can add packages to
# the build. Since we use diff_packages=false, these are ADDITIONS on top
# of the profile defaults — the profile already ships kmod-rtw88-8822ce +
# rtl8822ce-firmware + wpad-basic-mbedtls, so the Realtek choice needs
# nothing extra and the Intel choice just layers on Intel packages.
options:
  wifi_module:
    label: "Wi-Fi Module (M.2 slot)"
    default: none
    choices:
      none:
        label: "None installed (ethernet only)"
      realtek_rtl8822ce:
        label: "Realtek RTL8822CE (Wi-Fi 5)"
      intel_be200:
        label: "Intel BE200 (Wi-Fi 7)"
        packages:
          - kmod-iwlwifi
          - iwlwifi-firmware-be200
          # Replace wpad-basic-mbedtls (in profile defaults) with the
          # full version that supports WPA3/SAE and 802.11r/k/v roaming.
          # The - prefix tells ImageBuilder to remove the basic variant.
          - -wpad-basic-mbedtls
          - wpad-mbedtls
          - iw

packages:
  - orb

repositories:
  orb: "https://pkgs.orb.net/stable/openwrt-apk/aarch64_generic/packages.adb"

repository_keys:
  - orb-apk-ec.pub

# Verified on hardware: R5C's device mapping is the REVERSE of the E20C.
# mmcblk0 = SD card (no boot0/boot1), mmcblk1 = eMMC (has boot0/boot1).
install:
  hint: "Uncheck for SD-only operation (useful for validation runs or temporary deployments)."
  sd_device: /dev/mmcblk0
  emmc_device: /dev/mmcblk1
  size_from_partition: mmcblk0p2
  # TODO: confirm which front-panel LED is most visible during install.
  # Candidates: green:wan, green:lan, green:wlan. No green:sys on R5C.
  status_led: "green:wan"

install_notes: |
  1. Flash the downloaded image to an **SD card**.
  2. Insert the SD card into the NanoPi R5C and connect power (no ethernet yet).
  3. If **Install to eMMC** is enabled: watch the **SYS LED** — it pulses while writing to eMMC. Once the SYS LED goes **solid**, power off, remove the SD card, and re-insert power. The device now boots from eMMC.
  4. If running from **SD only**: wait for boot to complete, then the device is ready.
  5. Plug either ethernet port into your network.

defaults: |
  # Bridge both ethernet ports as a single DHCP client.
  uci set network.lan.device='br-lan'
  uci set network.lan.proto='dhcp'
  uci -q delete network.lan.ipaddr
  uci -q delete network.lan.netmask
  uci set network.@device[0]=device
  uci set network.@device[0].name='br-lan'
  uci set network.@device[0].type='bridge'
  uci set network.@device[0].ports='eth0 eth1'
  uci commit network

  # Remove stock WAN configuration.
  uci -q delete network.wan
  uci -q delete network.wan6
  uci commit network

  {{#wifi_ssid}}
  # Wi-Fi client configuration. Generate a scan_list from all
  # supported frequencies so the radio can roam across 2.4/5/6 GHz
  # bands. band='5g' is set to satisfy the PHY setup requirement;
  # scan_list overrides the actual scanning behavior.
  SCAN_LIST=$(iw phy phy0 info | grep -E '^\s+\* [0-9]' | grep -v disabled | sed 's/.*\* \([0-9]*\)\..*/\1/' | tr '\n' ' ')

  uci set wireless.radio0.band='5g'
  uci set wireless.radio0.channel='auto'
  uci set wireless.radio0.htmode='HE80'
  uci set wireless.radio0.disabled='0'
  uci set wireless.radio0.scan_list="$SCAN_LIST"

  uci -q delete wireless.default_radio0
  uci set wireless.sta0=wifi-iface
  uci set wireless.sta0.device='radio0'
  uci set wireless.sta0.mode='sta'
  uci set wireless.sta0.network='wwan'
  uci set wireless.sta0.ssid='{{{wifi_ssid}}}'
  uci set wireless.sta0.encryption='{{{wifi_encryption}}}'
  uci set wireless.sta0.key='{{{wifi_password}}}'

  uci set network.wwan=interface
  uci set network.wwan.proto='dhcp'

  # Add wwan to the LAN firewall zone so the device is reachable
  # via SSH over Wi-Fi (not just ethernet).
  uci add_list firewall.@zone[0].network='wwan'

  uci commit wireless
  uci commit network
  uci commit firewall
  {{/wifi_ssid}}
