id: friendlyarm_nanopi-zero2
title: "NanoPi Zero2"
description: "Compact Orb probe with M.2 slot for optional Wi-Fi. Uses a custom OpenWrt build — the first build may take ~45 minutes if the ImageBuilder hasn't been pre-built yet."
vendor_url: "https://wiki.friendlyelec.com/wiki/index.php/NanoPi_Zero2"
docs_url: "https://orb.net/docs/devices/nanopi-zero2"

target: rockchip/armv8
profile: friendlyarm_nanopi-zero2
arch: aarch64_generic

# Custom branch — triggers the builder API to check/build the
# ImageBuilder container from dboze/openwrt (pm-domains-fix branch).
# See branches.yaml for the builder config.
version: "zero2"
custom_branch: "zero2"

capabilities:
  wifi: true

# Same M.2 Wi-Fi module options as the R5C.
options:
  wifi_module:
    label: "Wi-Fi Module (M.2 slot)"
    default: none
    choices:
      none:
        label: "None installed (ethernet only)"
      realtek_rtl8822ce:
        label: "Realtek RTL8822CE (Wi-Fi 5)"
      intel_be200:
        label: "Intel BE200 (Wi-Fi 7)"
        packages:
          - kmod-iwlwifi
          - iwlwifi-firmware-be200
          - -wpad-basic-mbedtls
          - wpad-mbedtls
          - wpa-cli
          - iw

  # USB-C iPhone-tethered diagnostic mode. Brings up an NCM USB gadget on
  # usb0 (192.168.42.1/24) with DHCP for the iPhone and an avahi mDNS
  # advertisement of `_ssh._tcp` carrying TXT record `id=wlanpi` — that's
  # the exact discovery handshake WiFi Explorer Pi (iOS) uses to find
  # WLAN Pi-compatible devices. The iOS app then SSHes in over usb0 and
  # drives capture remotely, so the only thing the device needs to expose
  # is SSH + mDNS. Most useful with `wifi_module=intel_be200` since the
  # BE200 is what the iOS app actually captures on.
  #
  # Kernel prereq: dboze/openwrt branch add-nanopi-zero2-clean must have
  # the DWC3 dual-role + USB gadget + configfs NCM kernel config landed.
  # See openwrt-builder/RK3528-OTG-NOTES.md for the diff and rationale.
  usb_diagnostic:
    label: "USB-C diagnostic mode (iPhone tethered)"
    default: disabled
    choices:
      disabled:
        label: "Disabled"
      enabled:
        label: "Enabled — NCM gadget + WiFi Explorer Pi discovery"
        packages:
          - avahi-daemon
          - uhttpd
          # libcap-bin gives us setcap(8) so we can grant tcpdump/iw the
          # narrow caps WiFi Explorer Pi's remote-sensor flow needs
          # (NET_RAW / NET_ADMIN) without leaving them setuid-root.
          - libcap-bin
          # shadow-utils tools we use to create the wlanpi user and put
          # it in the docker group. OpenWrt's busybox build doesn't
          # include the adduser/useradd applets, so we have to bring in
          # the shadow-utils equivalents explicitly.
          - shadow-useradd
          - shadow-usermod
          - shadow-chpasswd

packages:
  - orb

repositories:
  orb: "https://pkgs.orb.net/stable/openwrt-apk/aarch64_generic/packages.adb"

repository_keys:
  - orb-apk-ec.pub

# Hardware-verified device mapping (eMMC=mmcblk0, SD=mmcblk1).
# Not all Zero2 SKUs ship with the eMMC module.
install:
  hint: "Not all models have eMMC. Uncheck for SD-only operation."
  sd_device: /dev/mmcblk1
  emmc_device: /dev/mmcblk0
  size_from_partition: mmcblk1p2
  status_led: "green:status"

install_notes: |
  1. Flash the downloaded image to an **SD card**.
  2. Insert the SD card and connect power. If the device boots into the SD image, skip to step 4.
  3. **First-time only** If eMMC is not blank, the existing bootloader may prioritize eMMC boot and skip the SD card. SSH into the running eMMC system and run: `dd if=/dev/zero of=/dev/mmcblk0 bs=512 count=32768` then pull power, re-insert it, and the SD card will boot. Subsequent reflashes boot from SD automatically. If you cannot get SSH or serial access to the exisitng eMMC OS, see vendor instructions for clearing eMMC: https://wiki.friendlyelec.com/wiki/index.php/NanoPi_Zero2#Step_4:_Erase_eMMC
  4. If **Install to eMMC** is enabled: the **green status LED** blinks while writing. When all LEDs pulse together, power off, remove the SD card, and re-insert power.
  5. If running from **SD only**: wait for boot to complete.
  6. Plug ethernet into your network.

  **USB-C diagnostic mode** (if selected): plug a USB-C cable from the Zero2 into an iPhone. The iPhone gets a DHCP lease on `192.168.42.0/24` and reaches the device at `192.168.42.1` over the USB link. WiFi Explorer Pi (iOS) auto-discovers the device via mDNS (`_ssh._tcp` + TXT `id=wlanpi`) and drives capture over SSH. The diagnostic mode is most useful with the **Intel BE200** Wi-Fi module installed — without a Wi-Fi card there's nothing for the iOS app to capture on.

  Before opening WiFi Explorer Pi, navigate to `http://192.168.42.1/` from the iPhone browser and tap **Enable Monitor Mode** — this releases netifd's hold on `wlan0` so the iOS app's capture script can take it over. When done, tap **Restore Normal Wi-Fi** to put `wlan0` back into client mode (Orb resumes).

defaults: |
  # Single ethernet port as DHCP client (Zero2 has only eth0).
  uci set network.lan.device='eth0'
  uci set network.lan.proto='dhcp'
  uci -q delete network.lan.ipaddr
  uci -q delete network.lan.netmask
  # Remove the bridge — not needed with a single port.
  uci -q delete network.@device[0]
  uci commit network

  # Remove stock WAN configuration.
  uci -q delete network.wan
  uci -q delete network.wan6
  uci commit network

  {{#wifi_ssid}}
  # WL LED — device-specific sysfs path. Wi-Fi client config is in _common.yaml.
  uci set system.led_wlan=led
  uci set system.led_wlan.name='WLAN'
  uci set system.led_wlan.sysfs='green:status'
  uci set system.led_wlan.trigger='netdev'
  uci set system.led_wlan.dev='wlan0'
  uci set system.led_wlan.mode='link tx rx'
  uci commit system
  {{/wifi_ssid}}

  {{#usb_diagnostic_enabled}}
  # USB-C iPhone-tethered diagnostic mode.
  #
  # Four pieces:
  #   1. /etc/init.d/sensorbox-gadget — configures the NCM USB gadget at
  #      boot via configfs and brings up usb0 with a static address.
  #   2. usb0 network + dhcp config — gives the iPhone a DHCP lease.
  #      usb0 is added to the lan firewall zone so SSH from the iPhone
  #      reaches dropbear (which listens on all interfaces by default).
  #   3. /etc/avahi/services/wlanpi.service — advertises _ssh._tcp with
  #      TXT id=wlanpi so WiFi Explorer Pi (iOS) discovers the device.
  #   4. /www/index.html — small web UI at http://192.168.42.1/ with
  #      buttons to switch wlan0 between client mode (Orb) and
  #      capture-ready mode (WiFi Explorer Pi). The user taps the toggle
  #      before/after capturing; explicit mode switch keeps wlan0 in
  #      normal Wi-Fi for Orb the rest of the time. CGI handlers gated to
  #      192.168.42.0/24 source IPs (the USB subnet) via REMOTE_ADDR check.
  #   5. wlanpi user + sudoers + setcap — WiFi Explorer Pro's remote-sensor
  #      SSH flow expects the standard WLAN Pi conventions: username
  #      `wlanpi`, password `wlanpi`, NOPASSWD sudo for tcpdump/iw/ip/
  #      scandump, and the network caps already attached to tcpdump/iw
  #      so they work without sudo when invoked directly. Baked in so
  #      WEPro Just Works once the user plugs an iPhone into the Zero2
  #      and connects the SSH-based sensor.

  # Create the wlanpi user. The shadow-useradd / -usermod / -chpasswd
  # packages installed by usb_diagnostic give us the standard tools —
  # OpenWrt's busybox build excludes adduser/useradd. -m creates the
  # home directory, -U creates a same-named primary group.
  useradd -m -s /bin/ash -d /home/wlanpi -U wlanpi 2>/dev/null || true
  echo 'wlanpi:wlanpi' | chpasswd

  # wlanpi in the docker group so the /usr/bin/scandump wrapper (which
  # exec's `docker run`) works without sudo. Docker group is effectively
  # root-equivalent — that's accepted for this opinionated sensor
  # appliance; the wlanpi user already has NOPASSWD sudo for the tools
  # it needs, so the group membership doesn't change the security
  # boundary in practice.
  usermod -aG docker wlanpi

  mkdir -p /etc/sudoers.d
  cat > /etc/sudoers.d/wifiexplorerpi <<'WEPRO_SUDOERS'
  wlanpi ALL=(root) NOPASSWD: /usr/bin/tcpdump, /usr/sbin/iw, /sbin/ip, /usr/sbin/ip, /bin/ip, /usr/bin/scandump
  WEPRO_SUDOERS
  chmod 0440 /etc/sudoers.d/wifiexplorerpi

  # File caps: tcpdump needs raw sockets, iw needs nl80211 + raw.
  # `+ep` = effective + permitted, so the caps activate the moment the
  # binary execs (no need to invoke through a capability-aware shell).
  setcap cap_net_raw+ep /usr/bin/tcpdump 2>/dev/null || true
  setcap cap_net_admin,cap_net_raw+ep /usr/sbin/iw 2>/dev/null || true

  cat > /etc/init.d/sensorbox-gadget <<'GADGET_INIT'
  #!/bin/sh /etc/rc.common
  # Mount configfs, build the NCM gadget, bind it to the dwc3 UDC, bring
  # usb0 up. Idempotent — re-running is a no-op.
  START=85
  STOP=15
  USE_PROCD=1

  GADGET_DIR=/sys/kernel/config/usb_gadget/orb
  HOST_MAC=02:11:22:33:44:55
  DEV_MAC=02:aa:bb:cc:dd:ee

  start_service() {
      # Use /proc/mounts (always present) rather than `mountpoint` which
      # isn't shipped in OpenWrt's busybox build.
      grep -q ' /sys/kernel/config configfs ' /proc/mounts || \
          mount -t configfs none /sys/kernel/config 2>/dev/null

      [ -d /sys/kernel/config/usb_gadget ] || {
          logger -t sensorbox-gadget "usb_gadget configfs subsystem not registered; aborting"
          return 1
      }

      # Pick the first UDC (typically fe500000.usb on the Zero2).
      UDC=$(ls /sys/class/udc 2>/dev/null | head -1)
      [ -n "$UDC" ] || {
          logger -t sensorbox-gadget "no UDC available; aborting"
          return 1
      }

      if [ ! -d "$GADGET_DIR" ]; then
          mkdir -p "$GADGET_DIR"
          echo 0x1d6b > "$GADGET_DIR/idVendor"   # Linux Foundation
          echo 0x0104 > "$GADGET_DIR/idProduct"  # Multifunction Composite
          echo 0x0100 > "$GADGET_DIR/bcdDevice"
          echo 0x0200 > "$GADGET_DIR/bcdUSB"

          mkdir -p "$GADGET_DIR/strings/0x409"
          echo "sensorbox"        > "$GADGET_DIR/strings/0x409/manufacturer"
          echo "Sensorbox Zero2"  > "$GADGET_DIR/strings/0x409/product"
          cat /proc/sys/kernel/random/uuid | tr -d '-' > "$GADGET_DIR/strings/0x409/serialnumber"

          mkdir -p "$GADGET_DIR/configs/c.1/strings/0x409"
          echo "NCM" > "$GADGET_DIR/configs/c.1/strings/0x409/configuration"
          echo 250   > "$GADGET_DIR/configs/c.1/MaxPower"

          mkdir -p "$GADGET_DIR/functions/ncm.usb0"
          echo "$HOST_MAC" > "$GADGET_DIR/functions/ncm.usb0/host_addr"
          echo "$DEV_MAC"  > "$GADGET_DIR/functions/ncm.usb0/dev_addr"

          ln -s "$GADGET_DIR/functions/ncm.usb0" "$GADGET_DIR/configs/c.1/"
      fi

      # Bind to UDC if not already bound.
      if [ -z "$(cat $GADGET_DIR/UDC 2>/dev/null)" ]; then
          echo "$UDC" > "$GADGET_DIR/UDC"
      fi

      # Wait briefly for the kernel to create usb0, then let netifd own it.
      for i in 1 2 3 4 5; do
          [ -d /sys/class/net/usb0 ] && break
          sleep 1
      done
      ifup usb0 2>/dev/null || true
      logger -t sensorbox-gadget "gadget configured; bound to $UDC"
  }

  stop_service() {
      [ -d "$GADGET_DIR" ] || return 0
      echo "" > "$GADGET_DIR/UDC" 2>/dev/null || true
      ifdown usb0 2>/dev/null || true
  }
  GADGET_INIT
  chmod +x /etc/init.d/sensorbox-gadget
  /etc/init.d/sensorbox-gadget enable
  # procd scans /etc/rc.d/ for services *before* uci-defaults runs at
  # first boot, so the S85 symlink we just created isn't visible to
  # procd's startup pass. Without an explicit invocation here, the
  # gadget doesn't come up until the next reboot — at which point the
  # symlink is in place. Backgrounded so uci-defaults can still exit 0
  # and be deleted normally. Mirrors the eMMC installer pattern in
  # _common.yaml.
  /etc/rc.common /etc/init.d/sensorbox-gadget boot &

  # usb0 as a static interface, in the lan firewall zone so SSH from the
  # iPhone is accepted (dropbear binds all ifaces by default; usb0 just
  # needs to be a known-trusted zone for fw4 to allow input).
  uci set network.usb0=interface
  uci set network.usb0.proto='static'
  uci set network.usb0.device='usb0'
  uci set network.usb0.ipaddr='192.168.42.1'
  uci set network.usb0.netmask='255.255.255.0'
  uci commit network

  uci add_list firewall.@zone[0].network='usb0'
  uci commit firewall

  # DHCP on usb0 so the iPhone auto-configures.
  #
  # dhcp_option 3 + 6 suppressed (empty values) — without these, dnsmasq
  # advertises the Zero2 as both the default gateway and DNS for the
  # client. iOS then picks usb0 as its primary route, but the Zero2 has
  # no upstream internet, so the iPhone loses connectivity for anything
  # not on 192.168.42.0/24 (including Orb cloud APIs for teleport).
  # Suppressing both keeps the on-link route intact (so 192.168.42.1 is
  # still reachable) while leaving the host's Wi-Fi/cellular as default.
  uci set dhcp.usb0=dhcp
  uci set dhcp.usb0.interface='usb0'
  uci set dhcp.usb0.start='2'
  uci set dhcp.usb0.limit='50'
  uci set dhcp.usb0.leasetime='12h'
  uci add_list dhcp.usb0.dhcp_option='3'
  uci add_list dhcp.usb0.dhcp_option='6'
  # _common.yaml locks dnsmasq to lo; add usb0 back so the gadget DHCP
  # above actually serves the iPhone.
  uci add_list dhcp.@dnsmasq[0].interface='usb0'
  uci commit dhcp

  # mDNS advertisement so WiFi Explorer Pi (iOS) finds the device. Per
  # empirical research against wlanpi-pi-gen, the iOS app browses for
  # _ssh._tcp services with TXT record "id=wlanpi" — that's the entire
  # discovery handshake. No custom service type needed.
  mkdir -p /etc/avahi/services
  cat > /etc/avahi/services/wlanpi.service <<'AVAHI_SERVICE'
  <?xml version="1.0" standalone='no'?>
  <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
  <service-group>
    <name replace-wildcards="yes">%h</name>
    <service>
      <type>_ssh._tcp</type>
      <port>22</port>
      <txt-record>id=wlanpi</txt-record>
    </service>
  </service-group>
  AVAHI_SERVICE

  # Enable + (re)start avahi so it picks up the service file.
  /etc/init.d/avahi-daemon enable
  /etc/init.d/avahi-daemon restart 2>/dev/null || /etc/init.d/avahi-daemon start

  # Web UI: monitor-mode toggle for WiFi Explorer Pi flows. Served at
  # http://192.168.42.1/ (root) so the iPhone Safari URL is short.
  mkdir -p /www/cgi-bin

  cat > /www/index.html <<'CAPTURE_HTML'
  <!doctype html>
  <html><head><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orb Capture Mode</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 2em; text-align: center; }
    button { font-size: 1.2em; padding: 1em 2em; margin: 1em; border-radius: 8px; border: none; color: white; cursor: pointer; }
    .on { background: #c33; } .off { background: #393; }
    #status { margin-top: 2em; font-family: monospace; white-space: pre; text-align: left; max-width: 40em; margin-left: auto; margin-right: auto; }
  </style></head>
  <body>
  <h1>Orb Capture Mode</h1>
  <p>Use before opening WiFi Explorer Pi.</p>
  <button class="on" onclick="hit('/cgi-bin/monitor-on')">Enable Monitor Mode</button>
  <button class="off" onclick="hit('/cgi-bin/monitor-off')">Restore Normal Wi-Fi</button>
  <div id="status"></div>
  <script>
  async function hit(url) {
    document.getElementById('status').textContent = 'Running ' + url + ' ...';
    const r = await fetch(url, { method: 'POST' });
    const t = await r.text();
    document.getElementById('status').textContent = t;
  }
  </script>
  </body></html>
  CAPTURE_HTML

  cat > /www/cgi-bin/monitor-on <<'MONITOR_ON'
  #!/bin/sh
  echo "Content-Type: text/plain"
  echo
  case "$REMOTE_ADDR" in 192.168.42.*) ;;
      *) echo "403: USB-tethered network only ($REMOTE_ADDR)"; exit ;; esac
  ubus call network.wireless down 2>&1
  sleep 1
  PHY=$(ls /sys/class/ieee80211/ 2>/dev/null | head -1)
  [ -n "$PHY" ] && [ ! -d /sys/class/net/wlan0 ] && \
      iw phy "$PHY" interface add wlan0 type managed
  echo "OK monitor mode ready"
  iw dev
  MONITOR_ON

  cat > /www/cgi-bin/monitor-off <<'MONITOR_OFF'
  #!/bin/sh
  echo "Content-Type: text/plain"
  echo
  case "$REMOTE_ADDR" in 192.168.42.*) ;;
      *) echo "403: USB-tethered network only ($REMOTE_ADDR)"; exit ;; esac
  iw dev wlan0 del 2>/dev/null
  for mon in $(iw dev | awk '/Interface/{print $2}' | grep '^itb'); do
      iw dev "$mon" del 2>/dev/null
  done
  ubus call network.wireless up 2>&1
  echo "OK restored"
  sleep 2
  iw dev
  MONITOR_OFF

  chmod +x /www/cgi-bin/monitor-on /www/cgi-bin/monitor-off

  # uhttpd: ensure CGI dispatch + the standard /www docroot. Default install
  # config already covers this on OpenWrt, but make it explicit and safe to
  # re-run (`uci -q delete` ignores missing keys).
  uci -q set uhttpd.main.home='/www'
  uci -q set uhttpd.main.cgi_prefix='/cgi-bin'
  uci commit uhttpd
  /etc/init.d/uhttpd enable
  /etc/init.d/uhttpd restart 2>/dev/null || /etc/init.d/uhttpd start
  {{/usb_diagnostic_enabled}}
