id: raspberrypi_rpi-4
title: "Raspberry Pi 4 / CM4"
description: "Raspberry Pi 4B, Pi 400, or CM4 with a carrier board (e.g. WLAN Pi M4+ / Mcuzone Wi-Fi 7 PoE). Wi-Fi via onboard Broadcom or an M.2 Intel BE200."
vendor_url: "https://www.raspberrypi.com/products/raspberry-pi-4-model-b/"
docs_url: "https://orb.net/docs/devices"

target: bcm27xx/bcm2711
profile: rpi-4
arch: aarch64_cortex-a72
# Untested at this version on rpi-4 — bump after validating Wi-Fi association
# end-to-end on real hardware (any of: Pi 4B onboard, CM4 onboard, M.2 BE200).
version: "25.12.2"

capabilities:
  wifi: true

# diff_packages=false: choices below are ADDITIONS on top of the rpi-4 profile.
# The profile already ships brcmfmac firmware + wpad-basic-mbedtls, so the
# onboard option only swaps in the full wpad (for WPA3/SAE) and adds iw/wpa-cli;
# the BE200 option layers on the Intel kmod and firmware.
options:
  wifi_module:
    label: "Wi-Fi Module"
    default: onboard_broadcom
    choices:
      none:
        label: "None (ethernet only)"
      onboard_broadcom:
        label: "Onboard Broadcom (Pi 4B / CM4)"
        packages:
          - -wpad-basic-mbedtls
          - wpad-mbedtls
          - wpa-cli
          - iw
      intel_be200:
        label: "Intel BE200 on M.2"
        packages:
          - kmod-iwlwifi
          - iwlwifi-firmware-be200
          - -wpad-basic-mbedtls
          - wpad-mbedtls
          - wpa-cli
          - iw
        # Per-module override slot for the wifi-temp.sh telemetry helper
        # (consumed by _common.yaml when system telemetry is enabled).
        # The generic case "iwl*" in _common already covers BE200; this
        # override exists as a worked example for chipsets that need
        # non-standard hwmon paths.
        wifi_temp_probe: |
          for hw in /sys/class/hwmon/hwmon*; do
              [ -r "$hw/name" ] || continue
              case "$(cat "$hw/name")" in iwl*) ;; *) continue ;; esac
              [ -r "$hw/temp1_input" ] || continue
              milli=$(cat "$hw/temp1_input")
              printf 'wifi_temp,module=intel_be200 temp_celsius=%s\n' "$(awk "BEGIN{printf \"%.2f\", $milli/1000}")"
              exit 0
          done

packages:
  - orb

repositories:
  orb: "https://pkgs.orb.net/stable/openwrt-apk/aarch64_cortex-a72/packages.adb"

repository_keys:
  - orb-apk-ec.pub

# No `install:` block. CM4 eMMC must be flashed externally via rpiboot over
# USB-C (the SoC enters mass-storage mode); a runtime SD->eMMC dd doesn't
# apply. Run from SD only, or flash CM4 eMMC out-of-band.

install_notes: |
  This image targets the Raspberry Pi 4 family — **Pi 4B**, **Pi 400**, and **CM4** (with any M.2-capable carrier such as the WLAN Pi M4+ / Mcuzone Wi-Fi 7 PoE). The OpenWrt `rpi-4` profile is one image that boots on all of them.

  **Wi-Fi:** the dropdown selects which packages are baked in. *Onboard Broadcom* uses the SoC's built-in 43455 — no extra hardware needed. *Intel BE200 on M.2* needs a way to bring M.2 PCIe to the Pi — typically a CM4 carrier board, but Pi 4B M.2 HATs that route the SoC's PCIe lane work too. At first boot the image self-adapts: if it detects an `iwlwifi` PHY (BE200 present), it disables the onboard Broadcom radio and uses the BE200 as `wlan0`; otherwise it leaves the onboard Broadcom in place.

  1. Flash the downloaded image to an **SD card**.
  2. Insert the SD card and connect power.
  3. Plug ethernet into the Pi (or into the carrier's GbE port).

  **No eMMC installer.** This recipe deliberately omits the SD->eMMC installer used by the NanoPi R5C / Radxa E20C recipes. CM4 eMMC is flashed externally via `rpiboot` (USB-C device mode), not via runtime dd from a booted SD card.

defaults: |
  # Bridge the GbE port for DHCP. Both Pi 4B (single eth0) and CM4 carriers
  # (single eth0 brought out by the carrier) use one ethernet PHY. br-lan
  # keeps shape parity with the multi-port recipes.
  uci set network.lan.device='br-lan'
  uci set network.lan.proto='dhcp'
  uci -q delete network.lan.ipaddr
  uci -q delete network.lan.netmask
  uci set network.@device[0]=device
  uci set network.@device[0].name='br-lan'
  uci set network.@device[0].type='bridge'
  uci set network.@device[0].ports='eth0'
  uci commit network

  # No WAN: this is a probe, not a router.
  uci -q delete network.wan
  uci -q delete network.wan6
  uci commit network

  {{#wifi_ssid}}
  # Self-adapting Wi-Fi setup. The image is the same for Pi 4B (onboard
  # only) and CM4 + M.2 BE200 carriers. We branch at runtime on whether
  # an iwlwifi PHY is currently enumerated — if so, the user has an M.2
  # Intel card and we want to make it the only radio (disable onboard
  # Broadcom permanently in /boot/config.txt and live-unload brcmfmac so
  # wlan0 maps to the BE200 on this boot too). If not, the onboard
  # Broadcom is the only radio and _common.yaml's wifi setup already
  # bound it correctly.
  HAS_IWLWIFI=0
  for _phy in /sys/class/ieee80211/*; do
      [ -L "$_phy/device/driver" ] || continue
      case "$(basename "$(readlink "$_phy/device/driver")")" in
          iwlwifi) HAS_IWLWIFI=1 ;;
      esac
  done

  if [ "$HAS_IWLWIFI" = 1 ]; then
      # Persist disable-onboard for next boot. Also adds a GPIO-26 fan
      # overlay for Mcuzone-style carriers (harmless on carriers without
      # one). Idempotent via marker comment.
      if [ -f /boot/config.txt ] && ! grep -q '^# orb-forge: ' /boot/config.txt; then
          cat >> /boot/config.txt <<'CFGTXT_EOF'

  # orb-forge: Intel M.2 card detected; disable CM4 onboard Wi-Fi/BT so
  # the M.2 BE200 is the only Wi-Fi PHY. Also add a GPIO-26 fan overlay
  # for Mcuzone-style carriers (harmless on carriers without one).
  [cm4]
  dtoverlay=disable-wifi
  dtoverlay=disable-bt
  dtoverlay=gpio-fan,gpiopin=26,temp=70000
  [all]
  CFGTXT_EOF
      fi

      # Live: snapshot _common's wireless settings, drop onboard Broadcom,
      # rebuild wireless config from current PHY state (only BE200 left),
      # re-apply settings to the regenerated radio0. This makes Wi-Fi
      # work on FIRST boot without waiting for a power-cycle.
      _SAVED_BAND=$(uci -q get wireless.radio0.band)
      _SAVED_HTMODE=$(uci -q get wireless.radio0.htmode)
      _SAVED_COUNTRY=$(uci -q get wireless.radio0.country)
      _SAVED_CHANNEL=$(uci -q get wireless.radio0.channel)
      _SAVED_DISABLED=$(uci -q get wireless.radio0.disabled)
      _SAVED_SCAN_LIST=$(uci -q get wireless.radio0.scan_list)
      _SAVED_SSID=$(uci -q get wireless.sta0.ssid)
      _SAVED_KEY=$(uci -q get wireless.sta0.key)
      _SAVED_ENCRYPTION=$(uci -q get wireless.sta0.encryption)

      # Tear down any pre-existing wlan interfaces. brcmfmac auto-creates
      # a default wlan0 when it loads, which keeps the driver in use and
      # makes rmmod fail silently. Removing the interfaces first lets the
      # rmmod succeed, AND clears the wlan0 name so netifd can re-create
      # it on the BE200's PHY without collision.
      for _iface in $(iw dev 2>/dev/null | awk '/Interface/{print $2}'); do
          ip link set "$_iface" down 2>/dev/null
          iw dev "$_iface" del 2>/dev/null
      done

      rmmod brcmfmac 2>/dev/null || true
      rmmod brcmutil 2>/dev/null || true

      rm -f /etc/config/wireless
      wifi config

      uci set wireless.radio0.band="$_SAVED_BAND"
      uci set wireless.radio0.htmode="$_SAVED_HTMODE"
      uci set wireless.radio0.country="$_SAVED_COUNTRY"
      uci set wireless.radio0.channel="${_SAVED_CHANNEL:-auto}"
      uci set wireless.radio0.disabled="${_SAVED_DISABLED:-0}"
      [ -n "$_SAVED_SCAN_LIST" ] && uci set wireless.radio0.scan_list="$_SAVED_SCAN_LIST"

      uci -q delete wireless.default_radio0
      uci set wireless.sta0=wifi-iface
      uci set wireless.sta0.device='radio0'
      uci set wireless.sta0.mode='sta'
      uci set wireless.sta0.network='wwan'
      uci set wireless.sta0.ssid="$_SAVED_SSID"
      uci set wireless.sta0.encryption="$_SAVED_ENCRYPTION"
      uci set wireless.sta0.key="$_SAVED_KEY"
      uci set wireless.sta0.ifname='wlan0'

      uci commit wireless
      wifi reload 2>/dev/null
  fi
  {{/wifi_ssid}}
