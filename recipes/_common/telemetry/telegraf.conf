[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = false

[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.mem]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]
[[inputs.system]]
[[inputs.temp]]
[[inputs.net]]
[[inputs.exec]]
  commands = ["/usr/libexec/orb-telemetry/wifi-temp.sh"]
  timeout = "5s"
  data_format = "influx"
{{#telemetry_include_wireless}}
[[inputs.wireless]]
{{/telemetry_include_wireless}}

[[outputs.http]]
  url = "{{{telemetry_url}}}"
  method = "POST"
  data_format = "influx"
  username = "{{{telemetry_username}}}"
  password = "{{{telemetry_password}}}"
  timeout = "10s"
