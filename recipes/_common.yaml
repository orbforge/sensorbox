# Shared pre-amble for every orb-forge recipe. The firmware-selector renders
# this block's `defaults` with Mustache, prepends it to the device recipe's
# rendered `defaults`, and sends the concatenation to ASU as the build
# request's `defaults` field.
#
# Everything in here is an orb-forge invariant — true for every device, not
# optional. Device-specific config belongs in the per-device recipe, not here.

defaults: |
  # Seed the Orb deployment token. The orb service reads ORB_DEPLOYMENT_TOKEN
  # from /etc/config/orb on first start and auto-links to the user's account.
  # See https://orb.net/docs/setup-sensor/linux/openwrt.
  cat > /etc/config/orb <<'ORBCFG'
  config orb 'orb'
      list env 'ORB_DEPLOYMENT_TOKEN={{{orb_token}}}'
  ORBCFG
  chmod 600 /etc/config/orb

  # Set root password. busybox passwd reads from stdin when non-interactive
  # and expects the new password twice (confirmation). The single-quoted
  # heredoc preserves shell metacharacters in the rendered password. We
  # suppress output and ignore exit status because busybox passwd prints
  # "Changing password for root" to stderr and may warn on weak passwords
  # without failing to set them. chpasswd is the cleaner tool but is not
  # in the default OpenWrt busybox build; passwd always is.
  passwd root >/dev/null 2>&1 <<'PWEOF' || true
  {{{root_password}}}
  {{{root_password}}}
  PWEOF

  # Populate /etc/config/system and set a unique hostname.
  #
  # On the Radxa E20C (and possibly other rockchip targets) the OpenWrt
  # base image ships with an empty /etc/config/system AND a stripped
  # busybox that has no `hostname` applet — so the normal init scripts
  # have neither config to read nor a command to apply it, and the
  # device boots as `(none)`. We work around both by writing the config
  # ourselves with a random-tail hostname so every probe is
  # individually identifiable, and nudging the kernel hostname directly
  # via /proc in case something on the boot path actually reads it.
  ORB_HOSTNAME="Orb-$((RANDOM % 10000))"
  cat > /etc/config/system <<SYSEOF
  config system
      option hostname '$ORB_HOSTNAME'
      option timezone 'UTC'
      option ttylogin '0'
      option log_size '64'
      option urandom_seed '0'
  SYSEOF
  echo "$ORB_HOSTNAME" > /etc/hostname 2>/dev/null || true
  echo "$ORB_HOSTNAME" > /proc/sys/kernel/hostname 2>/dev/null || true

  # Register Orb for automatic updates. The orb package (baked in via the
  # Orb apk feed at build time) ships /usr/bin/orb-update; `install` wires
  # it into whatever OpenWrt scheduling mechanism it uses.
  /usr/bin/orb-update install
