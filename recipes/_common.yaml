# Shared pre-amble for every orb-forge recipe. The firmware-selector renders
# this block's `defaults` with Mustache, prepends it to the device recipe's
# rendered `defaults`, and sends the concatenation to ASU as the build
# request's `defaults` field.
#
# Everything in here is an orb-forge invariant — true for every device, not
# optional. Device-specific config belongs in the per-device recipe, not here.

defaults: |
  # Seed the Orb deployment token. The orb service reads ORB_DEPLOYMENT_TOKEN
  # from /etc/config/orb on first start and auto-links to the user's account.
  # See https://orb.net/docs/setup-sensor/linux/openwrt.
  cat > /etc/config/orb <<'ORBCFG'
  config orb 'orb'
      list env 'ORB_DEPLOYMENT_TOKEN={{{orb_token}}}'
  ORBCFG
  chmod 600 /etc/config/orb

  # Set root password. busybox passwd reads from stdin when non-interactive
  # and expects the new password twice (confirmation). The single-quoted
  # heredoc preserves shell metacharacters in the rendered password. We
  # suppress output and ignore exit status because busybox passwd prints
  # "Changing password for root" to stderr and may warn on weak passwords
  # without failing to set them. chpasswd is the cleaner tool but is not
  # in the default OpenWrt busybox build; passwd always is.
  passwd root >/dev/null 2>&1 <<'PWEOF' || true
  {{{root_password}}}
  {{{root_password}}}
  PWEOF

  # Assign a unique random-tail hostname via uci so every probe is
  # individually identifiable on a LAN. The `uci add system system`
  # guard covers the (unlikely) case where the base image ships no
  # [system] section at all. OpenWrt's stock init applies this to the
  # running kernel on boot without going through the busybox `hostname`
  # applet (which is compiled out on some rockchip targets) — verified
  # on Radxa E20C 25.12.2.
  ORB_HOSTNAME="Orb-$((RANDOM % 10000))"
  uci -q get system.@system[0] >/dev/null || uci add system system >/dev/null
  uci set system.@system[0].hostname="$ORB_HOSTNAME"
  uci commit system

  # Persist the Orb apk feed on the running device so orb-update can
  # actually fetch new Orb versions at runtime. ASU consumes this feed
  # at image-build time via the build request's `repositories` field,
  # but that configuration is consumed during ImageBuilder assembly and
  # is NOT carried into the final image's apk config — mirroring
  # pkgs.orb.net/install.sh's apk3 path is required. The architecture
  # is read from /etc/apk/arch on the device so any future target gets
  # the right value without recipe plumbing. The key content is
  # Mustache-substituted by the selector from the first file listed in
  # the recipe's repository_keys (convention: the Orb apk signing key
  # is always first).
  mkdir -p /etc/apk/keys /etc/apk/repositories.d
  cat > /etc/apk/keys/orb-packages.pem <<'ORB_APK_KEY_EOF'
  {{{orb_apk_key}}}
  ORB_APK_KEY_EOF

  ORB_APK_ARCH=$(cat /etc/apk/arch 2>/dev/null || echo aarch64_generic)
  ORB_APK_FEED="https://pkgs.orb.net/stable/openwrt-apk/${ORB_APK_ARCH}/packages.adb"
  if ! grep -qxF "$ORB_APK_FEED" /etc/apk/repositories.d/customfeeds.list 2>/dev/null; then
      echo "$ORB_APK_FEED" >> /etc/apk/repositories.d/customfeeds.list
  fi

  # Register Orb for automatic updates. The orb package (baked in via
  # the Orb apk feed at build time) ships /usr/bin/orb-update; `install`
  # wires it into whatever OpenWrt scheduling mechanism it uses. This
  # runs AFTER the feed setup above so that when orb-update eventually
  # calls apk to check for new versions, the feed is already in place.
  /usr/bin/orb-update install
