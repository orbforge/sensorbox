server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static firmware-selector assets (from the submodule, overlaid with our
    # config.js via a second bind mount in compose.yaml).
    location / {
        try_files $uri $uri/ =404;
    }

    # Same-origin proxy to ASU. The browser talks only to this nginx on :8080,
    # so there is no cross-origin request and ASU does not need CORS headers.
    # Upstream hostname 'asu-server' resolves via the compose network.
    location /api/ {
        proxy_pass http://asu-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /store/ {
        proxy_pass http://asu-server:8000;
        proxy_set_header Host $host;
    }
}
